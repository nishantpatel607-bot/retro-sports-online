*{

body, html{

padding: 0;

height: 100%;

}

align-items: center;

}
#matchCanvas{ width: 100%; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; background: #0b132b; }

#bottom-nav{

justify-content: space-between;
align-items: center;
}
#canvas-container{
position: relative;
width: 100%;
height: auto;
min-height: 0;
flex: 1;
display: none;
align-items: center;
justify-content: center;

}
canvas{
width: 100%;
height: 100%;
display: block;
}
#touch-controls{ display: none; }
